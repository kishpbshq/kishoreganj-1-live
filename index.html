
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firebase Realtime Data</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      margin: 0;
      padding: 25px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 2px 10px #ddd;
    }

    h2 {
      text-align: center;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      box-sizing: border-box;
      font-size: 15px;
    }

    button {
      background: #087c42;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    #logoutButton {
      background: #c0392b;
    }

    #status {
      margin: 15px 0;
      font-weight: bold;
    }

    pre {
      background: #17202a;
      color: #00ff90;
      padding: 15px;
      border-radius: 7px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 100px;
    }

    #dataArea {
      display: none;
    }

    #message {
      color: #c0392b;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>Kishoreganj PBS</h2>
  <h3 style="text-align:center;">Firebase Realtime Database</h3>

  <!-- LOGIN -->
  <div id="loginArea">

    <input
      type="email"
      id="email"
      placeholder="Authentication Email"
      autocomplete="username"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button id="loginButton">Login</button>

    <p id="message"></p>

  </div>

  <!-- DATA -->
  <div id="dataArea">

    <div id="status">Connecting...</div>

    <button id="logoutButton">Logout</button>

    <h3>Live Database Data</h3>

    <pre id="firebaseData">Waiting for data...</pre>

  </div>

</div>


<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  import {
    getDatabase,
    ref,
    onValue,
    onDisconnect
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


  // FIREBASE CONFIGURATION

const firebaseConfig = {
  apiKey: "AIzaSyCHUJB83o2CzwGHEN-JnPXJW5RZRRfh-DA",
  authDomain: "kishoreganj-1-live.firebaseapp.com",
  databaseURL: "https://kishoreganj-1-live-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "kishoreganj-1-live",
  storageBucket: "kishoreganj-1-live.firebasestorage.app",
  messagingSenderId: "362129007391",
  appId: "1:362129007391:web:f241f32c96aedf699a462a",
  measurementId: "G-B4MGXFNQ8B"
};


  // INITIALIZE FIREBASE

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);


  const loginArea = document.getElementById("loginArea");
  const dataArea = document.getElementById("dataArea");
  const message = document.getElementById("message");
  const status = document.getElementById("status");
  const firebaseData = document.getElementById("firebaseData");

  let stopDataListener = null;


  // LOGIN

  document.getElementById("loginButton").addEventListener("click", async () => {

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    message.textContent = "";

    if (!email || !password) {
      message.textContent = "Please enter email and password.";
      return;
    }

    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (error) {
      message.textContent = "Login Error: " + error.code + "\n" + error.message;
      console.error(error);
    }

  });


  // AUTHENTICATION STATUS

  onAuthStateChanged(auth, (user) => {

    if (user) {

      loginArea.style.display = "none";
      dataArea.style.display = "block";

      status.textContent = "Logged in. Connecting to database...";

      startRealtimeData();

    } else {

      if (stopDataListener) {
        stopDataListener();
        stopDataListener = null;
      }

      loginArea.style.display = "block";
      dataArea.style.display = "none";

      status.textContent = "Disconnected";

    }

  });


  // REALTIME DATABASE LISTENER

  function startRealtimeData() {

    if (stopDataListener) {
      stopDataListener();
      stopDataListener = null;
    }

    const databaseRef = ref(db, "/Substation");

    stopDataListener = onValue(
      databaseRef,

      (snapshot) => {

        if (snapshot.exists()) {

          const data = snapshot.val();

          firebaseData.textContent =
            JSON.stringify(data, null, 2);

          status.textContent = "● Firebase Connected - Live Data";

          status.style.color = "green";

        } else {

          firebaseData.textContent = "No data found in /Substation";

          status.textContent = "Connected, but database is empty.";

          status.style.color = "orange";

        }

      },

      (error) => {

        console.error("Firebase Database Error:", error);

        status.textContent = "Database Error: " + error.message;

        status.style.color = "red";

        firebaseData.textContent = error.message;

      }

    );

  }


  // LOGOUT

  document.getElementById("logoutButton").addEventListener("click", async () => {

    try {
      await signOut(auth);
    } catch (error) {
      alert("Logout Error: " + error.message);
    }

  });

</script>

</body>
</html>
